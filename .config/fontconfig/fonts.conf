<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
<alias>
   <family>serif</family>
   <prefer>
     <family>GohuFont 14 Nerd Font</family>
   </prefer>

   <family>sans-serif</family>
   <prefer>
     <family>Hurmit Nerd Font</family>
   </prefer>

   <family>monospace</family>
   <prefer>
     <family>Hurmit Nerd Font</family>
   </prefer>
 </alias>
</fontconfig>
