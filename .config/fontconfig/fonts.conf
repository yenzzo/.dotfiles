<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
<alias>
   <family>serif</family>
   <prefer>
     <family>FiraCode Nerd Font Med</family>
   </prefer>

   <family>sans-serif</family>
   <prefer>
     <family>FiraCode Nerd Font Med</family>
   </prefer>

   <family>monospace</family>
   <prefer>
     <family>FiraMono Nerd Font Mono</family>
   </prefer>
 </alias>
</fontconfig>
