[opener]
   open = [
      { run = 'feh "$@"', desc = "Open" },
]

   edit = [
      { run = 'nvim "$@"', block = true },      
]

   read = [
      { run = 'zathura "$@"', desc = "Open" },
] 

[open]
prepend_rules = [
   { name = "*.pdf", use = [ "read" ] },
   { name = "*.epub", use = [ "read" ] },

]
