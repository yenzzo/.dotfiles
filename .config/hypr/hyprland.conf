################
### MONITORS ###
################

monitor = DP-3, 1920x1080@144, 0x0, 1 
monitor = HDMI-A-1, 1366x768@59.94Hz, -1366x0, 1

###################
### MY PROGRAMS ###
###################

# Programs setting
$terminal = kitty
$fileManager = pcmanfm 
$menu = wofi --show drun -D key_expand=Tab 


#################
### AUTOSTART ###
#################

exec-once = /usr/bin/hyprpaper 
exec-once = nwg-look -a 
exec-once = /usr/bin/hypridle
exec-once = /usr/bin/waybar
exec-once = hyprpm reload -n
#exec = hyprshade auto
exec-once = dbus-update-activation-environment --systemd HYPRLAND_INSTANCE_SIGNATURE
exec-once = /usr/bin/protonvpn-app
exec-once = fcitx5

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Capitaine_Gruvbox
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt5ct

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 4 
    gaps_out = 10 
    border_size = 4 
    col.inactive_border = rgb(1E2122) 
    col.active_border = rgb(1E2122) 
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 0 

    # Change transparency of focused and unfocused windows
    # active_opacity = 1.0
    # inactive_opacity = 0.7 

    shadow {
        enabled = true
        range = 3 
        render_power = 3
        color = rgba(02020266) 
	color_inactive = rgba(20, 20, 20, 0)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 2

        vibrancy = 0.1696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

  bezier = wind, 0.05, 0.9, 0.1, 1.05
  bezier = winIn, 0.1, 1.1, 0.1, 1.1
  bezier = winOut, 0.3, -0.3, 0, 1
  bezier = liner, 1, 1, 1, 1


  animation = windows, 1, 6, wind, gnomed 
  animation = windowsIn, 1, 6, winIn, gnomed 
  animation = windowsOut, 1, 5, winOut, gnomed 
  animation = windowsMove, 1, 5, wind, gnomed 
  animation = border, 1, 1, liner
  animation = borderangle, 1, 30, liner 
  animation = fade, 1, 10, default 
  animation = workspaces, 1, 5, wind, slidefade 
}

# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

input {
    kb_layout = us, br 
    kb_variant =
    kb_model =
    kb_options = grp:alt_space_toggle
    kb_rules =

    follow_mouse = 1

    sensitivity = -0.5 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }

    tablet {
        output = DP-3
	region_size = 1920, 1080
    }

}


device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

$mainMod = SUPER # Sets "Windows" key as main modifier

bind = $mainMod, Q, exec, [float; size 1500 700] $terminal
bind = $mainMod, C, killactive,
bind = $mainMod_SHIFT, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, W, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, F, fullscreen,
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, A, exec, hyprpicker -a -f hex 
bind = $mainMod, Z, exec, hyprshot -m region --clipboard-only
bind = $mainMod_SHIFT, Z, exec, hyprshot -m region -o /home/lainux/Pictures/tmp/screenshots/
bind = $mainMod_SHIFT, E, exec, kitty yazi
#bind = $mainMod_SHIFT, W, hyprtasking:toggle, all
#bind = $mainMod_SHIFT, W, hyprexpo:expo, toggle
bind = $mainMod_SHIFT, P, exec, rofimoji -a type copy -f math.csv emojis
bind = $mainMod, H, exec, hyprshade toggle
bind = $mainMod_SHIFT, B, split:grabroguewindows
bind = $mainMod, X, exec, ~/Scripts/ocr.sh
bind = $mainMod, B, exec, hyprsunset -t 1000
bind = $mainMod_ALT, B, exec, pkill hyprsunset

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
#bind = $mainMod, 1, workspace, 1
#bind = $mainMod, 2, workspace, 2
#bind = $mainMod, 3, workspace, 3
#bind = $mainMod, 4, workspace, 4
#bind = $mainMod, 5, workspace, 5
#bind = $mainMod, 6, workspace, 6
#bind = $mainMod, 7, workspace, 7
#bind = $mainMod, 8, workspace, 8
#bind = $mainMod, 9, workspace, 9
#bind = $mainMod, 0, workspace, 10
#bind = $mainMod, TAB, workspace, previous,
bind = $mainMod_SHIFT, left, split:workspace, r-1
bind = $mainMod_SHIFT, right, split:workspace, r+1
bind = SUPER, 1, split:workspace, 1
bind = SUPER, 2, split:workspace, 2
bind = SUPER, 3, split:workspace, 3
bind = SUPER, 4, split:workspace, 4
bind = SUPER, 5, split:workspace, 5
bind = SUPER, 6, split:workspace, 6
bind = SUPER, 7, split:workspace, 7
bind = SUPER, 8, split:workspace, 8
bind = SUPER, 9, split:workspace, 9
bind = SUPER, 0, split:workspace, 10


# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod CONTROL, 1, split:movetoworkspace, 1
bind = $mainMod CONTROL, 2, split:movetoworkspace, 2
bind = $mainMod CONTROL, 3, split:movetoworkspace, 3
bind = $mainMod CONTROL, 4, split:movetoworkspace, 4
bind = $mainMod CONTROL, 5, split:movetoworkspace, 5
bind = $mainMod CONTROL, 6, split:movetoworkspace, 6
bind = $mainMod CONTROL, 7, split:movetoworkspace, 7
bind = $mainMod CONTROL, 8, split:movetoworkspace, 8
bind = $mainMod CONTROL, 9, split:movetoworkspace, 9
bind = $mainMod CONTROL, 0, split:movetoworkspace, 10
bind = $mainMod CONTROL, right, split:movetoworkspace, r+1
bind = $mainMod CONTROL, left, split:movetoworkspace, r-1

# Workspace rules
#workspace = 1, monitor:DP-3, default:true

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod_CONTROL, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, split:workspace, e+1
bind = $mainMod, mouse_up, split:workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

plugin {
    hyprtasking {
        layout = linear 

        gap_size = 20
        bg_color = rgb(282828)
        border_size = 4

        gaps {
            rows = 3
        }
        linear {
            height = 300
            scroll_speed = 1.1;
        }
    }
}
