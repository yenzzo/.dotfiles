################
### MONITORS ###
################

monitor = DP-3, 1920x1080@144, 0x0, 1 

###################
### MY PROGRAMS ###
###################

$terminal = kitty
$menu = fuzzel


#################
### AUTOSTART ###
#################

exec-once = hyprpolkitagent
exec-once = nwg-look -a 
exec-once = /usr/bin/hypridle
exec-once = /usr/bin/waybar
exec-once = hyprpm reload -n
exec-once = dbus-update-activation-environment --systemd HYPRLAND_INSTANCE_SIGNATURE
#exec-once = /usr/bin/protonvpn-app
exec-once = fcitx5
exec-once = awww-daemon
exec-once = hyprshade on /home/lainux/.dotfiles/hypr/.config/hypr/shaders/main.glsl

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE, 24
env = HYPRCURSOR_SIZE, 24
env = HYPRCURSOR_THEME,Capitaine_Gruvbox
env = QT_QPA_PLATFORM, wayland
env = QT_QPA_PLATFORMTHEME, qt5ct
env = XDG_CURRENT_DEKSTOP, Hyprland
env = GTK_IM_MODULE, wayland
env = LIBVA_DRIVER_NAME, nvidia
env = __GLX_VENDOR_LIBRARY_NAME, nvidia

#####################
### LOOK AND FEEL ###
#####################

general {
   gaps_in = 4 
   gaps_out = 10 
   border_size = 4 
   col.inactive_border = rgba(282828FF)
   col.active_border = rgba(282828FF)
   resize_on_border = false
   allow_tearing = false
   layout = dwindle
}

decoration {
   rounding = 0 

   shadow {
       enabled = true
       range = 1 
       render_power = 4 
       offset = 10.5 10.5
       color = rgb(282828) 
   }

   blur {
      enabled = true
      size = 3
      passes = 2
      vibrancy = 0.1696
   }
}

animations {
   enabled = yes, please :)

   # animations
   bezier = wind, 0.05, 0.9, 0.1, 1.05
   bezier = winIn, 0.1, 1.1, 0.1, 1.1
   bezier = winOut, 0.3, -0.3, 0, 1
   bezier = liner, 1, 1, 1, 1

   animation = windows, 1, 6, wind, gnomed 
   animation = windowsIn, 1, 6, winIn, gnomed 
   animation = windowsOut, 1, 5, winOut, gnomed 
   animation = windowsMove, 1, 5, wind, gnomed 
   animation = border, 1, 1, liner
   animation = borderangle, 1, 30, liner 
   animation = fade, 1, 10, default 
   animation = workspaces, 1, 5, wind, slidefade 
}

# dwindle layout
dwindle {
   pseudotile = true
   preserve_split = true
}

master {
   new_status = master
}

misc {
   force_default_wallpaper = -1
   disable_hyprland_logo = true
}


#############
### INPUT ###
#############

input {
   kb_layout = us, kuntum
   kb_variant = 
   kb_model =
   kb_options = grp:alt_space_toggle
   kb_rules =

   follow_mouse = 1

   tablet {
      output = DP-3
	    region_size = 1920, 1080
   }
}

device {
   name = compx-ninjutso-sora-4k-1
   sensitivity = -0.4
}


###################
### KEYBINDINGS ###
###################

# modkey binding
$mainMod = SUPER # Sets "Windows" key as main modifier

# general
bind = $mainMod, Q, exec, $terminal #[float; size 1200 700; move 400 250]
bind = $mainMod, W, killactive,
bind = $mainMod SHIFT, E, exit,
bind = $mainMod, V, togglefloating,
bind = $mainMod, D, exec, $menu
bind = $mainMod ALT, P, pseudo, # dwindle
bind = $mainMod, S, layoutmsg, togglesplit # dwindle
bind = $mainMod, F, fullscreen,
bind = $mainMod ALT, L, exec, hyprlock
bind = $mainMod, Z, exec, hyprpicker -a -f hex 
bind = $mainMod, A, exec, hyprshot -m region --clipboard-only
bind = $mainMod SHIFT, A, exec, hyprshot -m region -o /home/lainux/Pictures/Screenshots
bind = $mainMod, Y, exec, kitty yazi
bind = $mainMod SHIFT, P, exec, rofimoji -a type copy -f math.csv emojis
#bind = $mainMod, H, exec, hyprshade toggle
bind = $mainMod, X, exec, ~/Scripts/ocr.sh
bind = $mainMod, B, exec, hyprsunset -t 2000 
bind = $mainMod ALT, B, exec, pkill hyprsunset

# Move focus with mainMod + arrow keys
bind = $mainMod, l, movefocus, r 
bind = $mainMod, h, movefocus, l 
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod, TAB, workspace, previous,
bind = $mainMod SHIFT, h, workspace, r-1
bind = $mainMod SHIFT, l, workspace, r+1

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod CONTROL, 1, movetoworkspace, 1
bind = $mainMod CONTROL, 2, movetoworkspace, 2
bind = $mainMod CONTROL, 3, movetoworkspace, 3
bind = $mainMod CONTROL, 4, movetoworkspace, 4
bind = $mainMod CONTROL, 5, movetoworkspace, 5
bind = $mainMod CONTROL, 6, movetoworkspace, 6
bind = $mainMod CONTROL, 7, movetoworkspace, 7
bind = $mainMod CONTROL, 8, movetoworkspace, 8
bind = $mainMod CONTROL, 9, movetoworkspace, 9
bind = $mainMod CONTROL, 0, movetoworkspace, 10
bind = $mainMod CONTROL SHIFT, l, movetoworkspace, r+1
bind = $mainMod CONTROL SHIFT, h, movetoworkspace, r-1

# view workspaces overview
bind = $mainMod, O, hyprexpo:expo, toggle

# Workspace rules
#workspace = 1, monitor:DP-3, default:true

# Example special workspace (scratchpad)
bind = $mainMod, P, togglespecialworkspace, magic
bind = $mainMod_CONTROL, P, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# Ignore maximize requests from apps. You'll probably like this.
windowrule {
   # Ignore maximize requests from all apps. You'll probably like this.
   name = suppress-maximize-events
   match:class = .*
   suppress_event = maximize
}

# set kitty default size
windowrule {
   name =
   match:title = kitty
   size = 1000 500 
   float = true
}

# Fix some dragging issues with XWayland
windowrule {
   name = fix-xwayland-drags
   match:class = ^$
   match:title = ^$
   match:xwayland = true
   match:float = true
   match:fullscreen = false
   match:pin = false
   no_focus = true
}

# hyprplugins
plugin {
   hyprtasking {
      layout = linear 
      gap_size = 20
      bg_color = rgb(282828)
      border_size = 4

      gaps {
         rows = 3
      }

      linear {
         height = 300
         scroll_speed = 1.1;
      }
   }

   hyprexpo {
      columns = 3 
      gap_size = 10 
      bg_col = rgb(282828)
      workspace_method = center current
      skip_empty = true
      gesture_distance = 300 # how far is the "max" for the gesture
   }
}

xwayland {
   force_zero_scaling = true
}
